<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto Javascript</title>

    <!-- Código CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <style>
      body { background-color: #cccccc; }
      div { background-color: #cccccc; }
    </style>

    <script>
      let lista = "";

      function cadastrar(event) { 
        event.preventDefault(); // Impede o reload da página

        let elNome = document.getElementById("nome");
        let elTelefone = document.getElementById("telefone");
        let elData = document.getElementById("dataDeNascimento");
        let elNota = document.getElementById("notaFinal");

        if (elNome.checkValidity() && elTelefone.checkValidity() && elData.checkValidity() && elNota.checkValidity()) {
          let nome = elNome.value;
          let telefone = elTelefone.value;
          
          let partesData = elData.value.split("-");
          let dataNascimento = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;
          
          let notaFinal = parseInt(elNota.value);

          lista += "<p><h6>Nome: " + nome + "<br> Telefone: " + telefone + "<br> Data de Nascimento: " + dataNascimento + "<br> Nota Final: " + notaFinal + "</h6><br></p>";
          
          document.getElementById("lista").innerHTML = lista;

          document.getElementById("formCadastro").reset();
        } else {
          document.getElementById("formCadastro").reportValidity();
        }
      }
    </script>
  </head>
  <body>
    
<div class="container-md">
  <main>
    <div style="width:25%; float:right;">
      <img class="d-block mx-auto mb-4" src="assets/brand/logo_azul.png" alt="Logo" width="72" height="57">
    </div>
  
    <h4 class="mb-3 mt-5">Cadastro de Alunos</h4>

    <form id="formCadastro" onsubmit="cadastrar(event)">
      <div style="width:75%; float:left">
        <div class="row col-lg-8">
          <div class="col">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" pattern="[A-Za-záàâãéèêíïóôõöúçñÁÀÂÃÉÈÍÏÓÔÕÖÚÇÑ ]+" class="form-control" id="nome" placeholder="Seu Nome" required> 
          </div>
        </div>

        <div class="row col-lg-8">
          <div class="col">
            <label for="telefone" class="form-label">Celular ou Telefone Fixo</label>
            <input type="text" pattern="\([0-9]{2}\)[0-9]{4,5}-[0-9]{4}$" class="form-control" id="telefone" placeholder="(00)12345-6789/(00)1234-5678" required> 
          </div>
        </div>

        <div class="row col-lg-8">
          <div class="col">
            <label for="dataDeNascimento" class="form-label">Data de Nascimento</label>
            <input type="date" min="1900-01-01" max="2026-12-31" class="form-control" id="dataDeNascimento" required>
          </div>
        </div>

        <div class="row col-lg-8">
          <div class="col">
            <label for="notaFinal" class="form-label">Nota final</label>
            <input type="number" min="0" max="10" class="form-control" id="notaFinal" placeholder="De 0 a 10 (números inteiros)" required>
          </div>
        </div>
        <br>

        <div class="row col-lg-8"> 
          <div class="col">
            <button class="w-100 btn btn-primary btn-lg" type="submit">Finalizar Cadastro</button>
          </div>
        </div>
        <br><br>

        <div class="row">
          <div class="col"><p><h4>Lista de Alunos</h4></p></div>
        </div>
        <div class="row">
          <div class="col" id="lista"></div>  
        </div>
      </div>   
    </form>  
  </main>
</div>
  </body>
</html>
