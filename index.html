   <script>
  let lista = "";

  function cadastrar() {
    let elNome = document.getElementById("nome");
    let elTelefone = document.getElementById("telefone");
    let elData = document.getElementById("dataDeNascimento");
    let elNota = document.getElementById("notaFinal");

    if (elNome.checkValidity() && elTelefone.checkValidity() && elData.checkValidity() && elNota.checkValidity()) {
      
      let nome = elNome.value;
      let telefone = elTelefone.value;
      let notaFinal = parseInt(elNota.value);

      let partesData = elData.value.split("-");
      let dataNascimento = `${partesData[2]}/${partesData[1]}/${partesData[0]}`;

      // 1. Atualiza a interface
      lista += `<p><strong>Nome:</strong> ${nome}<br> 
                <strong>Telefone:</strong> ${telefone}<br> 
                <strong>Data de Nascimento:</strong> ${dataNascimento}<br> 
                <strong>Nota Final:</strong> ${notaFinal}</p><hr>`;

      document.getElementById("lista").innerHTML = lista;

      // 2. Cria o objeto do novo aluno/pessoa
      let novoCadastro = {
        nome: nome,
        telefone: telefone,
        dataNascimento: dataNascimento,
        notaFinal: notaFinal
      };

      // 3. Limpa os campos
      elNome.value = "";
      elTelefone.value = "";
      elData.value = "";
      elNota.value = "";

      // Retorna o objeto cadastrado com sucesso
      return novoCadastro;

    } else {
      alert("Por favor, preencha todos os campos corretamente.");
      
      // Retorna null para indicar falha/validação incorreta
      return null; 
    }
  }
</script>
